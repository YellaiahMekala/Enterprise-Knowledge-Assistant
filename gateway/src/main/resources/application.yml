server:
  port: ${EKA_EDGE_PORT:8080}

spring:
  application:
    name: eka-edge
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 120s
          routes:
            # Everything under /api goes to the core, except what a controller answers itself
            # (GET /api/v1/me): controllers are matched before routes.
            - id: core-api
              uri: ${eka.edge.core-url}
              predicates:
                - Path=/api/**
              filters:
                # Stops sending traffic to a core that keeps failing, so callers get a fast 503
                # instead of waiting for a timeout each time.
                - name: CircuitBreaker
                  args:
                    name: core

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: ${EKA_EDGE_CB_WINDOW:20}
        minimum-number-of-calls: ${EKA_EDGE_CB_MIN_CALLS:10}
        failure-rate-threshold: 50
        wait-duration-in-open-state: ${EKA_EDGE_CB_OPEN_FOR:30s}
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      core:
        base-config: default
  timelimiter:
    # Answers can stream for a long time; the HTTP client's response timeout is the limit.
    configs:
      default:
        timeout-duration: 10m
    instances:
      core:
        base-config: default

management:
  # A separate port: health probes and the internal key set are not served to the public.
  server:
    port: ${EKA_EDGE_MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,jwks,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  # Traces (NFR-07): the edge starts the trace and sends W3C traceparent to the core. Spans are
  # exported only when an OTLP endpoint is set (e.g. http://jaeger:4318/v1/traces).
  tracing:
    sampling:
      probability: ${EKA_EDGE_TRACE_SAMPLE_RATIO:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${EKA_EDGE_OTEL_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    tracing:
      export:
        # Off unless an endpoint is given; an empty URL would stop the edge from starting.
        enabled: ${EKA_EDGE_OTEL_ENABLED:false}

eka:
  edge:
    core-url: ${EKA_EDGE_CORE_URL}
    pseudonym-secret: ${EKA_EDGE_PSEUDONYM_SECRET}
    oidc:
      issuer: ${EKA_EDGE_OIDC_ISSUER}
      jwk-set-uri: ${EKA_EDGE_OIDC_JWK_SET_URI}
      audience: ${EKA_EDGE_OIDC_AUDIENCE:eka-api}
    internal-token:
      signing-key-file: ${EKA_EDGE_SIGNING_KEY_FILE:}
      ephemeral-key: ${EKA_EDGE_EPHEMERAL_KEY:false}
