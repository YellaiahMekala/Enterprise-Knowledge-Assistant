server:
  port: ${OPS_AGENT_PORT:8090}

spring:
  application:
    name: eka-ops-agent
  mail:
    host: ${EKA_ALERT_SMTP_HOST:localhost}
    port: ${EKA_ALERT_SMTP_PORT:587}
    username: ${EKA_ALERT_SMTP_USER:}
    password: ${EKA_ALERT_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${EKA_ALERT_SMTP_AUTH:true}
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

ops:
  webhook-token: ${OPS_AGENT_WEBHOOK_TOKEN:}
  prometheus-url: ${OPS_AGENT_PROMETHEUS_URL:http://prometheus:9090}
  core-url: ${OPS_AGENT_CORE_URL:http://api:8000}
  edge-management-url: ${OPS_AGENT_EDGE_MANAGEMENT_URL:http://edge:8081}
  # Empty: the searchLogs tool answers that no log store is configured.
  loki-url: ${OPS_AGENT_LOKI_URL:}
  # Set the log group (for example /eka, the Terraform output log_group) to search CloudWatch Logs
  # instead of Loki. Region and credentials come from the AWS default chain.
  cloudwatch:
    log-group: ${OPS_AGENT_CLOUDWATCH_LOG_GROUP:}
    endpoint-url: ${OPS_AGENT_CLOUDWATCH_ENDPOINT_URL:}
  # On AWS: the SQS queue CloudWatch alarms reach through SNS (Terraform output alarm_queue_url).
  # Empty: only the Alertmanager webhook. Uses cloudwatch.endpoint-url too, for a local stand-in.
  alarm-queue-url: ${OPS_AGENT_ALARM_QUEUE_URL:}
  runbook-file: ${OPS_AGENT_RUNBOOK_FILE:/app/runbooks.md}
  # Longest an investigation may run before the runbook-only report is sent instead.
  investigation-timeout: ${OPS_AGENT_INVESTIGATION_TIMEOUT:3m}
  # Directory for accepted-but-unfinished batches, so a restart does not lose them. Empty: memory only.
  journal-dir: ${OPS_AGENT_JOURNAL_DIR:}
  max-tool-calls: ${OPS_AGENT_MAX_TOOL_CALLS:5}
  mail:
    to: ${EKA_ALERT_EMAIL_TO:}
    from: ${EKA_ALERT_EMAIL_FROM:${EKA_ALERT_SMTP_USER:}}
  model:
    api-key: ${EKA_CHAT_API_KEY:}
    name: ${EKA_CHAT_MODEL:gpt-4o-mini}
    base-url: ${EKA_CHAT_BASE_URL:https://api.openai.com/v1}
