# Local stack: PostgreSQL with pgvector, a one-shot migration, the API and the ingestion worker.
# Settings come from a git-ignored .env file (copy .env.example); nothing secret is stored here.
services:
  db:
    mem_limit: 1g
    # Exact tag, not "pg17": pgvector 0.8.7 on PostgreSQL 17.11 was recorded in phase P1.
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: eka
      POSTGRES_DB: eka
      POSTGRES_PASSWORD: ${EKA_DB_PASSWORD:?Set EKA_DB_PASSWORD in .env (copy .env.example)}
    ports:
      # Loopback only, for running migrations and tests from the host. Not for deployment.
      - "127.0.0.1:${EKA_DB_PORT:-5432}:5432"
    volumes:
      - eka-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eka -d eka"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Applies the schema once, then exits. The API and the worker start only after it succeeded.
  migrate:
    mem_limit: 512m
    build: .
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      EKA_DATABASE_URL: postgresql+psycopg://eka:${EKA_DB_PASSWORD}@db:5432/eka

  api:
    mem_limit: 1g
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      EKA_ENVIRONMENT: ${EKA_ENVIRONMENT:-local}
      EKA_LOG_LEVEL: ${EKA_LOG_LEVEL:-INFO}
      EKA_DATABASE_URL: postgresql+psycopg://eka:${EKA_DB_PASSWORD}@db:5432/eka
      EKA_AUTH_MODE: api_key
      EKA_API_KEYS: ${EKA_API_KEYS:?Set EKA_API_KEYS in .env (see .env.example)}
      # Optional web fallback (ADR-030), off unless set in .env.
      EKA_WEB_FALLBACK_ENABLED: ${EKA_WEB_FALLBACK_ENABLED:-false}
      EKA_WEB_ALLOWED_HOSTS: ${EKA_WEB_ALLOWED_HOSTS:-[]}
      EKA_WEB_ENTRY_URLS: ${EKA_WEB_ENTRY_URLS:-[]}
    volumes:
      - eka-files:/data/files

  # Parses, chunks and embeds uploaded documents. Downloads the embedding model (about 200 MB)
  # into the eka-models volume on its first start; later starts reuse it.
  worker:
    mem_limit: 2g
    build: .
    command: ["python", "-m", "eka.worker"]
    # The image's HTTP health check does not apply: the worker serves no HTTP. Its progress shows
    # in the logs and in the document statuses.
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      EKA_ENVIRONMENT: ${EKA_ENVIRONMENT:-local}
      EKA_LOG_LEVEL: ${EKA_LOG_LEVEL:-INFO}
      EKA_DATABASE_URL: postgresql+psycopg://eka:${EKA_DB_PASSWORD}@db:5432/eka
    volumes:
      - eka-files:/data/files
      - eka-models:/data/models

  # Edge profile: `docker compose --profile edge up`. The core behind it accepts only tokens the
  # edge signed, and is not published to the host. Needs an OIDC provider (EKA_EDGE_OIDC_*);
  # the edge refuses to start without them.
  core-behind-edge:
    mem_limit: 1g
    profiles: [edge]
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      EKA_ENVIRONMENT: ${EKA_ENVIRONMENT:-local}
      EKA_DATABASE_URL: postgresql+psycopg://eka:${EKA_DB_PASSWORD}@db:5432/eka
      EKA_AUTH_MODE: gateway
      EKA_GATEWAY_JWKS_URL: http://edge:8081/actuator/jwks
      # Optional web fallback (ADR-030), off unless set in .env.
      EKA_WEB_FALLBACK_ENABLED: ${EKA_WEB_FALLBACK_ENABLED:-false}
      EKA_WEB_ALLOWED_HOSTS: ${EKA_WEB_ALLOWED_HOSTS:-[]}
      EKA_WEB_ENTRY_URLS: ${EKA_WEB_ENTRY_URLS:-[]}
    volumes:
      - eka-files:/data/files

  edge:
    mem_limit: 768m
    profiles: [edge]
    build: ./gateway
    depends_on:
      - core-behind-edge
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
      EKA_EDGE_CORE_URL: http://core-behind-edge:8000
      EKA_EDGE_PSEUDONYM_SECRET: ${EKA_EDGE_PSEUDONYM_SECRET:-}
      EKA_EDGE_OIDC_ISSUER: ${EKA_EDGE_OIDC_ISSUER:-}
      EKA_EDGE_OIDC_JWK_SET_URI: ${EKA_EDGE_OIDC_JWK_SET_URI:-}
      EKA_EDGE_OIDC_AUDIENCE: ${EKA_EDGE_OIDC_AUDIENCE:-eka-api}
      EKA_EDGE_SIGNING_KEY_FILE: ${EKA_EDGE_SIGNING_KEY_FILE:-}
      EKA_EDGE_EPHEMERAL_KEY: ${EKA_EDGE_EPHEMERAL_KEY:-true}

  # Identity provider profile: `docker compose --profile idp up -d keycloak`. Imports the eka realm
  # (keycloak/realm-eka.json) with two test users. Passwords come from .env, not from the file.
  # Tokens carry the issuer http://keycloak:8180/realms/eka whichever host name the caller used,
  # so add `127.0.0.1 keycloak` to your hosts file to open the admin console by that name.
  keycloak:
    profiles: [idp]
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HTTP_PORT: "8180"
      KC_HOSTNAME: http://keycloak:8180
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${EKA_KEYCLOAK_ADMIN_PASSWORD:-}
      KC_ALICE_PASSWORD: ${EKA_KEYCLOAK_ALICE_PASSWORD:-}
      KC_BOSS_PASSWORD: ${EKA_KEYCLOAK_BOSS_PASSWORD:-}
    volumes:
      - ./keycloak/realm-eka.json:/opt/keycloak/data/import/realm-eka.json:ro
    ports:
      - "127.0.0.1:8180:8180"

  # Monitoring profile: `docker compose --profile monitoring up`. Put an admin API key (the
  # plain key, not its hash) in monitoring/secrets/admin_key; that folder is git-ignored.
  # Set EKA_GRAFANA_PASSWORD; if empty, Grafana keeps its default login (loopback only).
  prometheus:
    mem_limit: 512m
    profiles: [monitoring]
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/secrets:/etc/prometheus/secrets:ro
    ports:
      - "127.0.0.1:9090:9090"

  alertmanager:
    mem_limit: 128m
    profiles: [monitoring]
    image: prom/alertmanager:v0.28.1
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/secrets:/etc/alertmanager/secrets:ro
    ports:
      - "127.0.0.1:9093:9093"

  # Logs: Alloy reads this project's container logs from the Docker socket and pushes them to
  # Loki, labelled by compose service. Read by Grafana and by the ops agent's searchLogs tool.
  # The socket gives Alloy full control of Docker on this machine (":ro" does not limit the API),
  # which is acceptable for a local stack only; on AWS, logs go to CloudWatch through the task's
  # log driver instead.
  loki:
    mem_limit: 512m
    profiles: [monitoring]
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./monitoring/loki.yml:/etc/loki/loki.yml:ro
      - eka-loki:/loki
    ports:
      - "127.0.0.1:3100:3100"

  alloy:
    mem_limit: 256m
    profiles: [monitoring]
    image: grafana/alloy:v1.10.2
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    depends_on:
      - loki
    environment:
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-enterprise-knowledge-assistant}
    volumes:
      - ./monitoring/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Agent profile: `docker compose --profile monitoring --profile agent up -d`.
  # Receives Alertmanager webhooks, investigates with read-only tools, emails a report.
  ops-agent:
    profiles: [agent]
    build: ./ops-agent
    mem_limit: 512m
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
      OPS_AGENT_WEBHOOK_TOKEN: ${OPS_AGENT_WEBHOOK_TOKEN:-}
      OPS_AGENT_PROMETHEUS_URL: http://prometheus:9090
      OPS_AGENT_CORE_URL: http://core-behind-edge:8000
      OPS_AGENT_EDGE_MANAGEMENT_URL: http://edge:8081
      OPS_AGENT_LOKI_URL: http://loki:3100
      # A log group switches the searchLogs tool from Loki to CloudWatch Logs (needs AWS credentials).
      OPS_AGENT_CLOUDWATCH_LOG_GROUP: ${OPS_AGENT_CLOUDWATCH_LOG_GROUP:-}
      OPS_AGENT_RUNBOOK_FILE: /app/runbooks.md
      EKA_ALERT_EMAIL_TO: ${EKA_ALERT_EMAIL_TO:-}
      EKA_ALERT_EMAIL_FROM: ${EKA_ALERT_EMAIL_FROM:-}
      EKA_ALERT_SMTP_HOST: ${EKA_ALERT_SMTP_HOST:-mailpit}
      EKA_ALERT_SMTP_PORT: ${EKA_ALERT_SMTP_PORT:-1025}
      EKA_ALERT_SMTP_USER: ${EKA_ALERT_SMTP_USER:-}
      EKA_ALERT_SMTP_PASSWORD: ${EKA_ALERT_SMTP_PASSWORD:-}
      EKA_ALERT_SMTP_AUTH: ${EKA_ALERT_SMTP_AUTH:-false}
      EKA_CHAT_API_KEY: ${EKA_CHAT_API_KEY:-}
      EKA_CHAT_MODEL: ${EKA_CHAT_MODEL:-gpt-4o-mini}
    volumes:
      - ./docs/runbooks.md:/app/runbooks.md:ro
    ports:
      - "127.0.0.1:8090:8090"

  # A local mail catcher for trying the agent without real SMTP: web UI on http://localhost:8025.
  mailpit:
    mem_limit: 128m
    profiles: [agent]
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"

  grafana:
    mem_limit: 512m
    profiles: [monitoring]
    image: grafana/grafana:12.1.0
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${EKA_GRAFANA_PASSWORD:-}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  eka-pgdata:
  eka-files:
  eka-models:
  eka-loki:
