global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # The core's metrics are admin-only; the admin key is read from a file that is not in git.
  - job_name: core
    metrics_path: /api/v1/admin/metrics
    http_headers:
      X-API-Key:
        files: [/etc/prometheus/secrets/admin_key]
    static_configs:
      - targets: ['api:8000']

  # The edge serves metrics on its management port, which is not published.
  - job_name: edge
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['edge:8081']

  # Alertmanager's own metrics: the watchdog alert reads its webhook failure counter.
  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  # The triage agent's delivery counts (profile "agent"): accepted alerts, sent and failed reports.
  - job_name: ops-agent
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['ops-agent:8090']
