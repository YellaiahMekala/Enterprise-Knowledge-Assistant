name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported version, and the version the Docker image runs.
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy src tests
      - name: OpenAPI snapshot is current
        run: python -m eka.tools.export_openapi --check
      - name: Unit, component and architecture tests (no Docker needed)
        run: pytest -m "not integration"

  integration:
    # Real PostgreSQL with pgvector through Testcontainers: migrations, row-level security,
    # repositories. Also runs the whole suite once to enforce the coverage floor.
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Full suite with coverage gate (85%)
        run: pytest --cov=eka --cov-report=term-missing --cov-fail-under=85

  docker-image:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t eka:ci .
      - name: The image ships the migrations and the worker
        run: |
          docker run --rm eka:ci alembic history
          docker run --rm eka:ci python -c "import eka.worker, eka.adapters.embedder_fastembed"
          docker image inspect eka:ci --format 'image size: {{.Size}} bytes'
      - name: Smoke test the container
        # Liveness only: the container is started without a database, so readiness (which
        # checks the database) would correctly report 503. Startup validation needs settings,
        # so the smoke test supplies throwaway ones.
        run: |
          KEY_DIGEST=$(printf 'ci-smoke-key' | docker run --rm -i eka:ci python -m eka.tools.hash_key)
          docker run -d --name eka -p 8000:8000 \
            -e EKA_DATABASE_URL=postgresql+psycopg://ci:ci@127.0.0.1:1/ci \
            -e EKA_AUTH_MODE=api_key \
            -e "EKA_API_KEYS={\"ci\": {\"sha256\": \"${KEY_DIGEST}\", \"role\": \"user\"}}" \
            eka:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/live; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8000/health/live
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/me)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-API-Key: ci-smoke-key' http://localhost:8000/api/v1/me)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health/ready)" = 503
          docker logs eka
