[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eka"
version = "0.1.0"
description = "Retrieval-augmented chat over your documents, with answers that cite document, page and passage."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.115",
    "fastembed>=0.9.1,<0.10",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.6",
    "pypdf>=6.0",
    "python-docx>=1.2",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",
    "httpx2>=2.16",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "testcontainers>=4.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eka"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Libraries without type information.
module = ["pgvector.*", "testcontainers.*", "docker.*", "fastembed.*", "pypdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs Docker (real PostgreSQL with pgvector); skipped locally without Docker, always run in CI",
    "model: loads the real embedding model (about 200 MB download on first use); skipped unless EKA_TEST_REAL_MODEL=1",
]

[tool.coverage.run]
source = ["eka"]
# Migrations are exercised by the integration tests (apply, downgrade, drift check), not by line coverage.
omit = ["*/eka/migrations/*"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.$",
]
